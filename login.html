<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>
TicToc Login
</title>

<link
rel="stylesheet"
href="css/style.css"
>

</head>

<body>

<main
style="
min-height:100vh;
display:grid;
place-items:center;
padding:20px;
"
>

<div class="modal-box">

<div class="auth-logo">
◆
</div>

<h2>
Welcome to TicToc
</h2>

<p>
Login to enter your gaming world.
</p>

<form id="loginForm">

<div class="input-group">

<label>
Email
</label>

<input
id="email"
type="email"
placeholder="Enter email"
required
>

</div>

<div class="input-group">

<label>
Password
</label>

<input
id="password"
type="password"
placeholder="Enter password"
required
>

</div>

<button
class="primary-button full"
type="submit"
>
Login
</button>

</form>

<p id="message"></p>

<a
href="/"
class="secondary-button"
style="
width:100%;
margin-top:15px;
"
>
← Back to Home
</a>

</div>

</main>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("email")
                    .value;

            const password =
                document
                    .getElementById("password")
                    .value;

            const response =
                await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email,
                                password
                            })
                    }
                );

            const data =
                await response.json();

            document
                .getElementById("message")
                .textContent =
                data.message;

            if (data.success) {

                setTimeout(
                    () => {
                        window.location.href =
                            "/";
                    },
                    500
                );
            }

        }
    );

</script>

</body>

</html>
