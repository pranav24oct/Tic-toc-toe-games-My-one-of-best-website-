<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 800 500"
>

<defs>

<linearGradient
id="mainGradient"
x1="0"
y1="0"
x2="1"
y2="1"
>

<stop
offset="0"
stop-color="#8b5cf6"
/>

<stop
offset=".5"
stop-color="#22d3ee"
/>

<stop
offset="1"
stop-color="#ec4899"
/>

</linearGradient>


<filter
id="shadow"
x="-50%"
y="-50%"
width="200%"
height="200%"
>

<feDropShadow
dx="0"
dy="25"
stdDeviation="20"
flood-opacity=".4"
/>

</filter>

</defs>


<rect
width="800"
height="500"
rx="45"
fill="#080912"
/>


<circle
cx="110"
cy="80"
r="100"
fill="#8b5cf6"
opacity=".15"
/>


<circle
cx="690"
cy="420"
r="130"
fill="#22d3ee"
opacity=".12"
/>


<g
transform="translate(400 250)"
filter="url(#shadow)"
>

<polygon
points="-170,-120 0,-180 170,-120 0,-60"
fill="#a78bfa"
/>


<polygon
points="-170,-120 -170,80 0,150 0,-60"
fill="#6366f1"
/>


<polygon
points="170,-120 170,80 0,150 0,-60"
fill="url(#mainGradient)"
/>


<text
x="0"
y="35"
text-anchor="middle"
font-family="Arial"
font-size="60"
font-weight="bold"
fill="white"
>
TIC
</text>

</g>

</svg>